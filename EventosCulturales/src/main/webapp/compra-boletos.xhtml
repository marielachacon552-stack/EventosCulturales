<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Compra de Boletos</title>
    <link rel="stylesheet" href="css/principal.css"/>
</h:head>
<h:body>
    <f:view>
        <div class="app-wrapper">
            <h:form>
                <p:menubar model="#{tuBean.model}" styleClass="navbar">
                    <p:menuitem value="Dashboard"
                                url="dashboard.xhtml"
                                icon="pi pi-home"/>
                </p:menubar>
            </h:form>

            <div class="main-container">
                <h:form id="formCompra">
                    <div class="page-header">
                        <h1>Compra y Reserva de Boletos</h1>
                    </div>

                    <p:messages id="mensajes" showDetail="true" closable="true" />

                    <!-- Paso 1: Seleccionar Evento -->
                    <p:panel header="Paso 1: Seleccionar Evento" styleClass="form-panel">
                        <p:panelGrid columns="3" layout="grid">
                            <p:outputLabel value="Evento:" />
                            <p:selectOneMenu id="comboEvento" value="#{compraBoletosBean.eventoSeleccionado}"
                                             required="true"
                                             requiredMessage="Por favor, seleccione un evento."
                                             converter="omnifaces.SelectItemsConverter"
                                             style="width: 100%">
                                <f:selectItem itemLabel="-- Selecciona un evento --" itemValue="#{null}"/>
                                <f:selectItems value="#{compraBoletosBean.eventos}"
                                               var="evento"
                                               itemLabel="#{evento.titulo}"
                                               itemValue="#{evento}"/>
                            </p:selectOneMenu>

                            <p:commandButton value="Siguiente"
                                             action="#{compraBoletosBean.seleccionarEvento()}"
                                             ajax="true"
                                             update=":formCompra:panelDinamico :formCompra:mensajes"
                                             styleClass="btn-primary" />
                        </p:panelGrid>
                    </p:panel>


                    <h:panelGroup id="panelDinamico">
                        <p:panel header="Detalles del Evento" styleClass="form-panel"
                                 rendered="#{compraBoletosBean.eventoSeleccionado != null}">
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank">
                                <p:outputLabel value="Categoría:" style="font-weight:bold;" />
                                <h:outputText value="#{compraBoletosBean.eventoSeleccionado.categoria}" />

                                <p:outputLabel value="Fecha y Hora:" style="font-weight:bold;" />
                                <h:outputText value="#{compraBoletosBean.eventoSeleccionado.fechaHoraFormateada}" />

                                <p:outputLabel value="Ubicación:" style="font-weight:bold;" />
                                <h:outputText value="#{compraBoletosBean.eventoSeleccionado.ubicacion}" />

                                <p:outputLabel value="Precio por Boleto:" style="font-weight:bold;" />
                                <h:outputText id="lblPrecioBoleto" value="L. #{compraBoletosBean.eventoSeleccionado.precioBoleto}" />

                                <p:outputLabel value="Descripción:" style="font-weight:bold;" />
                                <h:outputText value="#{compraBoletosBean.eventoSeleccionado.descripcion}" />
                            </p:panelGrid>
                        </p:panel>

                        <!-- Paso 2: Seleccionar Asientos -->
                        <p:panel header="Paso 2: Seleccionar Asientos"
                                 styleClass="form-panel"
                                 rendered="#{compraBoletosBean.eventoSeleccionado != null}">
                            <p:outputLabel value="Asientos disponibles totales: #{compraBoletosBean.asientosDisponibles.size()}" style="display:block; margin-bottom:10px; font-weight:bold;"/>

                            <p:selectCheckboxMenu value="#{compraBoletosBean.asientosSeleccionados}"
                                                  label="Selecciona los asientos"
                                                  multiple="true"
                                                  filter="true" filterMatchMode="startsWith"
                                                  style="width: 100%;">
                                <f:selectItems value="#{compraBoletosBean.asientosDisponibles}"
                                               var="asiento"
                                               itemLabel="#{asiento.numeroAsiento}"
                                               itemValue="#{asiento.numeroAsiento}"/>

                                <p:ajax event="itemSelect" listener="#{compraBoletosBean.actualizarTotal()}" update=":formCompra:lblTotal"/>
                                <p:ajax event="itemUnselect" listener="#{compraBoletosBean.actualizarTotal()}" update=":formCompra:lblTotal"/>
                            </p:selectCheckboxMenu>
                        </p:panel>

                        <!-- Paso 3: Resumen y Pago -->
                        <p:panel header="Paso 3: Resumen de Compra"
                                 styleClass="form-panel"
                                 rendered="#{compraBoletosBean.eventoSeleccionado != null}">
                            <p:panelGrid columns="2" layout="grid">
                                <p:outputLabel value="Total a Pagar:" style="font-weight:bold; font-size: 1.2em;" />
                                <h:outputText id="lblTotal" value="L. #{compraBoletosBean.totalPago}"
                                              style="font-weight:bold; font-size: 1.2em; color: #2e7d32;" />
                            </p:panelGrid>

                            <p:commandButton value="💳 Proceder al Pago"
                                             oncomplete="PF('dlgPago').show();"
                                             update=":formPago"
                                             icon="pi pi-credit-card"
                                             style="margin-top: 20px; width: 100%;"/>
                        </p:panel>
                    </h:panelGroup>


                    <p:panel header="Mis Boletos Registrados" styleClass="form-panel" style="margin-top: 30px;">
                        <p:commandButton value="Recargar Lista"
                                         action="#{compraBoletosBean.cargarBoletosYReservas()}"
                                         ajax="false"
                                         icon="pi pi-refresh"
                                         style="margin-bottom: 15px;"/>

                        <p:dataTable id="tblMisBoletos" value="#{compraBoletosBean.misboletos}" var="boleto" emptyMessage="No tienes boletos registrados">
                            <p:column headerText="Código de Boleto">
                                <h:outputText value="#{boleto.codigoBoleto}" />
                            </p:column>

                            <p:column headerText="Asiento">
                                <h:outputText value="#{boleto.numeroAsiento}" />
                            </p:column>

                            <p:column headerText="Evento">
                                <h:outputText value="#{boleto.nombreEvento}" />
                            </p:column>

                            <p:column headerText="Estado">
                                <p:tag value="#{boleto.estado}" severity="#{boleto.estado == 'activo' ? 'success' : 'danger'}" />
                            </p:column>

                            <p:column headerText="Acciones" style="text-align: center;">
                                <p:commandButton value="Cancelar"
                                                 action="#{compraBoletosBean.cancelarBoleto(boleto)}"
                                                 process="@this"
                                                 update="tblMisBoletos :formCompra:mensajes"
                                                 styleClass="ui-button-danger"
                                                 icon="pi pi-times"
                                                 disabled="#{boleto.estado != 'activo'}">
                                    <p:confirm header="Confirmación" message="¿Estás seguro de cancelar este boleto?" icon="pi pi-exclamation-triangle"/>
                                </p:commandButton>
                            </p:column>
                        </p:dataTable>
                    </p:panel>

                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="350">
                        <p:commandButton value="No" type="button" styleClass="ui-confirmdialog-no ui-button-flat"/>
                        <p:commandButton value="Sí, cancelar" type="button" styleClass="ui-confirmdialog-yes ui-button-danger" />
                    </p:confirmDialog>
                </h:form>

                <p:dialog header="Pasarela de Pago Seguro" widgetVar="dlgPago" modal="true" resizable="false" responsive="true" width="450" styleClass="pasarela-pago">
                    <h:form id="formPago">
                        <div style="display: flex; flex-direction: column; gap: 12px; padding: 5px;">

                            <!-- Titular -->
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <h:outputLabel value="Titular de la Tarjeta:" style="font-weight: bold; color: #4a2e2b; font-size: 0.9rem;" />
                                <p:inputText required="true" placeholder="Ej. Juan Pérez" style="width: 100%; padding: 6px;" />
                            </div>

                            <!-- Número de Tarjeta -->
                            <div style="display: flex; flex-direction: column; gap: 4px;">
                                <h:outputLabel value="Número de Tarjeta:" style="font-weight: bold; color: #4a2e2b; font-size: 0.9rem;" />
                                <p:inputText required="true" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" style="width: 100%; padding: 6px;" />
                            </div>

                            <!-- Fila Expiración y CVV -->
                            <div style="display: flex; gap: 15px;">
                                <div style="display: flex; flex-direction: column; gap: 4px; flex: 1;">
                                    <h:outputLabel value="Expiración:" style="font-weight: bold; color: #4a2e2b; font-size: 0.9rem;" />
                                    <p:inputText required="true" placeholder="MM/AA" maxlength="5" style="width: 100%; padding: 6px;" />
                                </div>
                                <div style="display: flex; flex-direction: column; gap: 4px; flex: 1;">
                                    <h:outputLabel value="CVV / Seguridad:" style="font-weight: bold; color: #4a2e2b; font-size: 0.9rem;" />
                                    <p:password required="true" placeholder="123" maxlength="3" style="width: 100%; padding: 6px;" />
                                </div>
                            </div>

                        </div>

                        <!-- Botones Alineados Correctamente -->
                        <div style="margin-top: 25px; display: flex; justify-content: flex-end; gap: 10px; border-top: 1px solid #eee; padding-top: 15px;">
                            <p:commandButton value="Cancelar" onclick="PF('dlgPago').hide();" type="button" styleClass="ui-button-secondary" style="background-color: #6c757d; border: none; color: white;" />
                            <p:commandButton value="Confirmar y Pagar"
                                             action="#{compraBoletosBean.procesarCompra()}"
                                             oncomplete="PF('dlgPago').hide();"
                                             update=":formCompra"
                                             ajax="false"
                                             icon="pi pi-check"
                                             styleClass="btn-primary"
                                             style="background-color: #9c4732; border: none; color: white;" />
                        </div>
                    </h:form>
                </p:dialog>
            </div>
        </div>
    </f:view>
</h:body>
</html>
