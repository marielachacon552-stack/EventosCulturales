<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Eventos Culturales - Login</title>
    <link rel="stylesheet" href="css/principal.css"/>
    <h:outputStylesheet name="primefaces.css"/>
</h:head>
<h:body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <h1>🎭 EVENTOS CULTURALES</h1>
                <p>Sistema de Reservas</p>
            </div>

            <h:form>
                <div class="form-group">
                    <label>Correo Electrónico</label>
                    <p:inputText id="correo" 
                                value="#{loginBean.correo}" 
                                placeholder="tu@email.com"
                                required="true"
                                requiredMessage="El correo es obligatorio"
                                styleClass="form-control"/>
                    <p:message for="correo"/>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <p:password id="contrasena" 
                               value="#{loginBean.contrasena}" 
                               placeholder="••••••••"
                               required="true"
                               requiredMessage="La contraseña es obligatoria"
                               styleClass="form-control"
                               feedback="false"/>
                    <p:message for="contrasena"/>
                </div>

                <p:commandButton value="Iniciar Sesión" 
                               action="#{loginBean.login()}"
                               icon="pi pi-sign-in"
                               styleClass="btn-login"
                               process="@form"
                               update="@form"/>

                <div class="demo-credentials">
                    <p><strong>Credenciales de prueba:</strong></p>
                    <p>📧 admin@eventos.hn / admin123</p>
                    <p>📧 organizador@eventos.hn / admin123</p>
                    <p>📧 carlos@cliente.hn / admin123</p>
                </div>
            </h:form>

            <p:messages id="mensajes" showDetail="true" closable="true" />
        </div>
    </div>
</h:body>
</html>
