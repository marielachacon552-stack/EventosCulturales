<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Compra de Boletos</title>
    <link rel="stylesheet" href="css/principal.css"/>
</h:head>
<h:body>
    <f:view>
        <div class="app-wrapper">
            <!-- Barra Lateral / Menú Principal -->
            <h:form>
                <p:menubar model="#{tuBean.model}" styleClass="navbar">
                    <p:menuitem value="🏠 Dashboard" url="dashboard.xhtml" />
                    <p:menuitem value="👤 #{dashboardBean.usuarioActual.nombre} | Salir" action="#{loginBean.logout()}" icon="pi pi-sign-out"/>
                </p:menubar>
            </h:form>

            <!-- Contenedor Principal a la derecha de la barra lateral -->
            <div class="main-container">
                <h:form id="formCompra">
                    <div class="page-header">
                        <h1>🎫 Compra y Reserva de Boletos</h1>
                    </div>

                    <p:messages id="mensajes" showDetail="true" closable="true" />

                    <!-- Paso 1: Seleccionar Evento -->
                    <p:panel header="Paso 1: Seleccionar Evento" styleClass="form-panel">
                        <p:panelGrid columns="3" layout="grid">
                            <p:outputLabel value="Evento:" />
                            <p:selectOneMenu id="comboEvento" value="#{compraBoletosBean.eventoSeleccionado}"
                                             required="true"
                                             requiredMessage="Por favor, seleccione un evento."
                                             converter="omnifaces.SelectItemsConverter"
                                             style="width: 100%">
                                <f:selectItem itemLabel="-- Selecciona un evento --" itemValue="#{null}"/>
                                <f:selectItems value="#{compraBoletosBean.eventos}"
                                               var="evento"
                                               itemLabel="#{evento.titulo}"
                                               itemValue="#{evento}"/>
                            </p:selectOneMenu>

                            <p:commandButton value="Cargar Detalles"
                                             action="#{compraBoletosBean.seleccionarEvento()}"
                                             ajax="true"
                                             update=":formCompra:panelDinamico :formCompra:mensajes"
                                             icon="pi pi-search"
                                             styleClass="btn-primary" />
                        </p:panelGrid>
                    </p:panel>

                    <!-- Contenedor dinámico -->
                    <h:panelGroup id="panelDinamico">

                        <!-- Detalles del Evento -->
                        <p:panel header="Detalles del Evento" styleClass="form-panel"
                                 rendered="#{compraBoletosBean.eventoSeleccionado != null}">
                            <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank">
                                <p:outputLabel value="Categoría:" style="font-weight:bold;" />
                                <h:outputText value="#{compraBoletosBean.eventoSeleccionado.categoria}" />

                                <p:outputLabel value="Fecha y Hora:" style="font-weight:bold;" />
                                <h:outputText value="#{compraBoletosBean.eventoSeleccionado.fechaHoraFormateada}" />

                                <p:outputLabel value="Ubicación:" style="font-weight:bold;" />
                                <h:outputText value="#{compraBoletosBean.eventoSeleccionado.ubicacion}" />

                                <p:outputLabel value="Precio por Boleto:" style="font-weight:bold;" />
                                <h:outputText id="lblPrecioBoleto" value="L. #{compraBoletosBean.eventoSeleccionado.precioBoleto}" />

                                <p:outputLabel value="Descripción:" style="font-weight:bold;" />
                                <h:outputText value="#{compraBoletosBean.eventoSeleccionado.descripcion}" />
                            </p:panelGrid>
                        </p:panel>

                        <!-- Paso 2: Seleccionar Asientos -->
                        <p:panel header="Paso 2: Seleccionar Asientos"
                                 styleClass="form-panel"
                                 rendered="#{compraBoletosBean.eventoSeleccionado != null}">
                            <p:outputLabel value="Asientos disponibles totales: #{compraBoletosBean.asientosDisponibles.size()}" style="display:block; margin-bottom:10px; font-weight:bold;"/>

                            <p:selectCheckboxMenu value="#{compraBoletosBean.asientosSeleccionados}"
                                                  label="Selecciona los asientos"
                                                  multiple="true"
                                                  filter="true" filterMatchMode="startsWith"
                                                  style="width: 100%;">
                                <f:selectItems value="#{compraBoletosBean.asientosDisponibles}"
                                               var="asiento"
                                               itemLabel="#{asiento.numeroAsiento}"
                                               itemValue="#{asiento.numeroAsiento}"/>

                                <p:ajax event="itemSelect" listener="#{compraBoletosBean.actualizarTotal()}" update=":formCompra:lblTotal"/>
                                <p:ajax event="itemUnselect" listener="#{compraBoletosBean.actualizarTotal()}" update=":formCompra:lblTotal"/>
                            </p:selectCheckboxMenu>
                        </p:panel>

                        <!-- Paso 3: Resumen y Pago -->
                        <p:panel header="Paso 3: Resumen de Compra"
                                 styleClass="form-panel"
                                 rendered="#{compraBoletosBean.eventoSeleccionado != null}">
                            <p:panelGrid columns="2" layout="grid">
                                <p:outputLabel value="Total a Pagar:" style="font-weight:bold; font-size: 1.2em;" />
                                <h:outputText id="lblTotal" value="L. #{compraBoletosBean.totalPago}"
                                              style="font-weight:bold; font-size: 1.2em; color: #2e7d32;" />
                            </p:panelGrid>

                            <p:commandButton value="💳 Proceder al Pago"
                                             oncomplete="PF('dlgPago').show();"
                                             update=":formPago"
                                             icon="pi pi-credit-card"
                                             style="margin-top: 20px; width: 100%;"/>
                        </p:panel>
                    </h:panelGroup>

                    <!-- Mis Reservas y Boletos -->
                    <p:panel header="🎫 Mis Reservas y Boletos" styleClass="form-panel" style="margin-top: 30px;">
                        <p:commandButton value="Recargar Lista"
                                         action="#{compraBoletosBean.cargarBoletosYReservas()}"
                                         ajax="false"
                                         icon="pi pi-refresh"
                                         style="margin-bottom: 10px;"/>

                        <h3>Mis Boletos</h3>
                        <p:dataTable id="tblBoletos" value="#{compraBoletosBean.misboletos}" var="boleto" emptyMessage="No tienes boletos">
                            <p:column headerText="Código"><h:outputText value="#{boleto.codigoBoleto}" /></p:column>
                            <p:column headerText="Asiento"><h:outputText value="#{boleto.numeroAsiento}" /></p:column>
                        </p:dataTable>

                        <h3 style="margin-top: 30px;">Mis Reservas</h3>
                        <p:dataTable id="tblReservas" value="#{compraBoletosBean.misReservas}" var="reserva" emptyMessage="No tienes reservas">
                            <p:column headerText="Evento ID"><h:outputText value="#{reserva.eventoId}" /></p:column>
                            <p:column headerText="Total"><h:outputText value="L. #{reserva.totalPagado}" /></p:column>
                            <p:column headerText="Estado"><p:tag value="#{reserva.estado}" severity="success" /></p:column>
                        </p:dataTable>
                    </p:panel>
                </h:form>

                <!-- FORMULARIO / DIÁLOGO DE PAGO REALISTA -->
                <p:dialog header="Pasarela de Pago Seguro" widgetVar="dlgPago" modal="true" resizable="false" responsive="true" width="450">
                    <h:form id="formPago">
                        <p:panelGrid columns="2" layout="grid" styleClass="ui-panelgrid-blank" style="width:100%;">
                            <p:outputLabel value="Titular de la Tarjeta:" style="font-weight:bold;"/>
                            <p:inputText required="true" placeholder="Ej. Juan Pérez" style="width:100%;"/>

                            <p:outputLabel value="Número de Tarjeta:" style="font-weight:bold;"/>
                            <p:inputText required="true" placeholder="XXXX-XXXX-XXXX-XXXX" maxlength="19" style="width:100%;"/>

                            <p:outputLabel value="Fecha de Expiración:" style="font-weight:bold;"/>
                            <p:inputText required="true" placeholder="MM/AA" maxlength="5" style="width:100%;"/>

                            <p:outputLabel value="CVV / Código de Seguridad:" style="font-weight:bold;"/>
                            <p:password required="true" placeholder="123" maxlength="4" style="width:100%;"/>
                        </p:panelGrid>

                        <div style="margin-top: 20px; text-align: right;">
                            <p:commandButton value="Cancelar" onclick="PF('dlgPago').hide();" type="button" styleClass="ui-button-secondary" style="margin-right: 10px;"/>

                            <p:commandButton value="Confirmar y Pagar"
                                             action="#{compraBoletosBean.procesarCompra()}"
                                             oncomplete="PF('dlgPago').hide();"
                                             update=":formCompra"
                                             ajax="false"
                                             icon="pi pi-check"
                                             styleClass="btn-primary"/>
                        </div>
                    </h:form>
                </p:dialog>
            </div>
        </div>
    </f:view>
</h:body>
</html>
