<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
        "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:f="http://xmlns.jcp.org/jsf/core"
      xmlns:p="http://primefaces.org/ui">
<h:head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Gestión de Eventos</title>
    <link rel="stylesheet" href="css/principal.css"/>
</h:head>
<h:body>
    <f:view>
        <div class="app-wrapper">
            <h:form>
                <p:menubar styleClass="navbar">
                    <p:menuitem value="Dashboard"
                                url="dashboard.xhtml"
                                icon="pi pi-home"/>

                </p:menubar>
            </h:form>

            <div class="main-container">
                <h:form id="formAdminEventos">
                    <div class="page-header">
                        <h1>Gestión de Eventos Culturales</h1>
                        <p:commandButton value="Crear Nuevo Evento"
                                         icon="pi pi-plus"
                                         action="#{eventoCrudBean.abrirDialogoNuevo()}"
                                         process="@this"
                                         update=":formAdminEventos:dlgEvento"
                                         oncomplete="PF('dlgEvento').show();"
                                         styleClass="btn-primary"/>
                    </div>

                    <p:messages id="mensajes" showDetail="true" closable="true" />

                    <p:dataTable id="tblEventos"
                                 value="#{eventoCrudBean.eventos}"
                                 var="evento"
                                 rowsPerPageTemplate="5,10,15"
                                 paginator="true"
                                 rows="10"
                                 styleClass="eventos-table"
                                 emptyMessage="No hay eventos registrados">

                        <p:column headerText="Evento" width="25%">
                            <h:outputText value="#{evento.titulo}" />
                        </p:column>

                        <p:column headerText="Categoría" width="12%">
                            <p:tag value="#{evento.categoria}" severity="info" />
                        </p:column>

                        <p:column headerText="Fecha y Hora" width="22%">
                            <h:outputText value="#{evento.fechaHoraFormateada}" />
                        </p:column>

                        <p:column headerText="Precio" width="12%">
                            <h:outputText value="L. #{evento.precioBoleto}">
                                <f:convertNumber pattern="#,##0.00" />
                            </h:outputText>
                        </p:column>

                        <p:column headerText="Aforo" width="10%">
                            <h:outputText value="#{evento.aforoMaximo}" />
                        </p:column>

                        <p:column headerText="Acciones" width="23%">
                            <p:commandButton value="Editar"
                                             action="#{eventoCrudBean.abrirDialogoEditar()}"
                                             process="tblEventos"
                                             update=":formAdminEventos:dlgEvento"
                                             oncomplete="PF('dlgEvento').show();"
                                             icon="pi pi-pencil">
                                <f:setPropertyActionListener value="#{evento}" target="#{eventoCrudBean.eventoSeleccionado}" />
                            </p:commandButton>

                            <p:commandButton value="Eliminar"
                                             action="#{eventoCrudBean.eliminar()}"
                                             process="tblEventos"
                                             update="tblEventos,mensajes"
                                             icon="pi pi-trash"
                                             styleClass="btn-danger">
                                <f:setPropertyActionListener value="#{evento}" target="#{eventoCrudBean.eventoSeleccionado}" />
                                <p:confirm header="Confirmar Eliminación" message="¿Está seguro de que desea eliminar este evento?" icon="pi pi-exclamation-triangle"/>
                            </p:commandButton>
                        </p:column>
                    </p:dataTable>

                    <p:dialog id="dlgEvento" header="Gestión de Evento" widgetVar="dlgEvento" modal="true" style="width: 750px !important;" responsive="true">
                        <p:panelGrid columns="2" layout="grid" styleClass="form-grid" columnClasses="ui-grid-col-4, ui-grid-col-8">

                            <p:outputLabel value="Título:" />
                            <p:inputText value="#{eventoCrudBean.eventoSeleccionado.titulo}"
                                         required="true"
                                         requiredMessage="Título requerido"
                                         styleClass="w-100"/>

                            <p:outputLabel value="Categoría:" />
                            <p:selectOneMenu value="#{eventoCrudBean.eventoSeleccionado.categoria}" required="true" style="width: 100%;">
                                <f:selectItem itemLabel="-- Selecciona --" itemValue=""/>
                                <f:selectItem itemLabel="Teatro" itemValue="teatro"/>
                                <f:selectItem itemLabel="Concierto" itemValue="concierto"/>
                                <f:selectItem itemLabel="Exposición" itemValue="exposición"/>
                            </p:selectOneMenu>

                            <p:outputLabel value="Fecha y Hora:" />
                            <p:datePicker value="#{eventoCrudBean.eventoSeleccionado.fechaHora}"
                                          pattern="dd/MM/yyyy HH:mm"
                                          showTime="true"
                                          required="true"
                                          mindate="#{eventoCrudBean.fechaActualMinima}"
                                          styleClass="w-100"/>

                            <p:outputLabel value="Duración (minutos):" />
                            <p:inputNumber value="#{eventoCrudBean.eventoSeleccionado.duracion}"
                                           required="true"
                                           styleClass="w-100"/>

                            <p:outputLabel value="Precio del Boleto:" />
                            <p:inputNumber value="#{eventoCrudBean.eventoSeleccionado.precioBoleto}"
                                           required="true"
                                           decimalPlaces="2"
                                           styleClass="w-100"/>

                            <p:outputLabel value="Aforo Máximo:" />
                            <p:inputNumber value="#{eventoCrudBean.eventoSeleccionado.aforoMaximo}"
                                           required="true"
                                           styleClass="w-100"/>

                            <p:outputLabel value="Ubicación:" />
                            <p:inputText value="#{eventoCrudBean.eventoSeleccionado.ubicacion}"
                                         required="true"
                                         styleClass="w-100"/>

                            <p:outputLabel value="Descripción:" />
                            <p:inputTextarea value="#{eventoCrudBean.eventoSeleccionado.descripcion}"
                                             rows="3"
                                             styleClass="w-100"/>
                        </p:panelGrid>

                        <f:facet name="footer">
                            <p:commandButton value="Guardar"
                                             action="#{eventoCrudBean.guardar()}"
                                             process="dlgEvento"
                                             update="tblEventos,mensajes"
                                             oncomplete="PF('dlgEvento').hide();"
                                             icon="pi pi-check"/>
                            <p:commandButton value="Cancelar"
                                             action="#{eventoCrudBean.cancelar()}"
                                             process="@this"
                                             onclick="PF('dlgEvento').hide();"
                                             icon="pi pi-times"
                                             styleClass="btn-secondary"/>
                        </f:facet>
                    </p:dialog>

                    <p:confirmDialog global="true" showEffect="fade" hideEffect="fade" responsive="true" width="450px">
                        <p:commandButton value="Sí, eliminar" type="button" styleClass="ui-confirmdialog-yes btn-danger" icon="pi pi-check" />
                        <p:commandButton value="Cancelar" type="button" styleClass="ui-confirmdialog-no btn-secondary" icon="pi pi-times" />
                    </p:confirmDialog>

                </h:form>
            </div>
        </div>
    </f:view>
</h:body>
</html>
